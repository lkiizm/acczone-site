<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Accounts: AccZone · CoD Mobile Catalog</title>
<meta name="description" content="Full live catalog of AccZone CoD Mobile accounts on ZeusX, every listing with photos, details and instant delivery. 5.0★ gold seller.">

<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="All Accounts: AccZone CoD Mobile">
<meta property="og:description" content="Full live catalog with photos and details. Instant delivery, escrow protected.">
<meta property="og:url" content="https://aewop.online/accounts.html">
<meta name="theme-color" content="#07070a">
<link rel="icon" href="favicon.svg">

<style>
/* Hallmark · checked: 2026-11-02 · genre: modern-minimal · theme: monochrome steel · posture: restrained
   surface: absolute · hero: settled · nav: pill rail, centre · footer: hairline, one line
   pre-emit critique: P4 H5 E5 S4 R4 V4 · weakest: P, the page is a storefront with one job, so the hero stays a single sentence and the store link never moves */
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url("inter.woff2") format("woff2")}
:root{--c-scrim-2:var(--c-scrim-2);--c-cool-glow-lg:rgba(186,208,255,.35);--c-rule-6:var(--c-rule-6);--c-wash-5:var(--c-wash-5);
  --font-sans:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-sans-2:"Inter",system-ui,sans-serif; --c-light-rim:#f2f6ff; --c-light-lo:#d5def2; --c-light-hi:#f3f6ff; --c-well-3:#101010;
  --c-base:#07070a;
  --c-paper:#f4f4f6;
  --c-ink-1:#f3f3f3;
  --c-ink-2:#e6e6e6;
  --c-silver-hi:#e7e7e7;
  --c-silver-lo:#cfcfcf;
  --c-on-light:#111111;
  --c-muted:#9a9a9a;
  --c-well:#0b0b0e;
  --c-well-2:#0a0a0d;
  --c-steel-a:#0a0a0c;
  --c-steel-b:#2b2b2e;
  --c-steel-c:#4a4a4d;
  --c-steel-d:#3a3a3d;
  --c-steel-e:#6a6a6d;
  --c-badge-a:#7d7d80;
  --c-badge-t:#f2f2f2;
  --c-wash-1:rgba(244,244,246,.015);
  --c-wash-2:rgba(244,244,246,.03);
  --c-wash-3:rgba(244,244,246,.045);
  --c-wash-4:rgba(244,244,246,.05);
  --c-panel:rgba(244,244,246,.03);
  --c-panel-2:rgba(244,244,246,.05);
  --c-rule-1:rgba(244,244,246,.08);
  --c-rule-2:rgba(244,244,246,.12);
  --c-rule-3:rgba(244,244,246,.16);
  --c-rule-4:rgba(244,244,246,.32);
  --c-rule-5:rgba(244,244,246,.34);
  --c-grid-line:rgba(244,244,246,.25);
  --c-sheen:rgba(244,244,246,.45);
  --c-inset-hi:rgba(244,244,246,.95);
  --c-hairline:rgba(198,198,199,.55);
  --c-hairline-hi:rgba(235,235,236,.7);
  --c-hairline-hover:rgba(235,235,236,.9);
  --c-cool-hi:rgba(220,230,255,.8);
  --c-cool-glow:rgba(200,210,230,.18);
  --c-cool-glow-sm:rgba(200,210,230,.14);
  --c-cool-halo:rgba(170,200,255,.28);
  --c-cool-tint:rgba(150,170,200,.1);
  --c-shade-1:rgba(7,7,10,.3);
  --c-shade-2:rgba(7,7,10,.42);
  --c-shade-3:rgba(7,7,10,.46);
  --c-shade-4:rgba(7,7,10,.5);
  --c-shade-5:rgba(7,7,10,.55);
  --c-shade-6:rgba(7,7,10,.8);
  --c-shade-7:rgba(7,7,10,.82);
  --c-shade-8:rgba(7,7,10,.85);
  --c-shade-9:rgba(7,7,10,.15);
  --c-scrim:rgba(8,8,10,.42);
  --c-glass:rgba(8,8,10,.55);
  --c-focus:#9ec5ff;

  --bg:#000000; --text:#ffffff; --muted:#9a9a9a;
  --border:rgba(255,255,255,.16); --border-soft:rgba(255,255,255,.12);
  --panel:rgba(255,255,255,.03); --panel2:rgba(255,255,255,.05);
}
html,body{background:var(--c-base);color:var(--c-paper);overflow-x:clip}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  font-size:16px;line-height:1.6;overflow-x:clip;position:relative
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1150px;margin:0 auto;padding:0 1.2rem}

/* nav — vesper pills */
.nav{position:sticky;top:0;z-index:50;background:var(--c-shade-7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border-soft)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:60px}
.nav-logo{font-weight:600;font-size:15.5px;letter-spacing:-.03em;color:var(--c-paper)}
.nav-logo span{color:var(--muted);font-weight:400}
.nav-links{display:flex;gap:.5rem;align-items:center}
.nav-links a{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:7px;position:relative;overflow:hidden;
  border:1px solid var(--c-hairline);
  background:linear-gradient(105deg,var(--c-steel-a) 0%,var(--c-steel-b) 48%,var(--c-steel-c) 100%);
  color:var(--c-ink-1);font-size:13px;font-weight:400;letter-spacing:-.01em;white-space:nowrap;
  transition:background .35s ease,border-color .35s ease,box-shadow .35s ease}
.nav-links a::before{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,var(--c-rule-3) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .6s ease;pointer-events:none}
.nav-links a:hover{border-color:var(--c-hairline-hover);
  background:linear-gradient(105deg,var(--c-on-light) 0%,var(--c-steel-d) 45%,var(--c-steel-e) 100%);
  box-shadow:0 0 18px var(--c-cool-glow)}
.nav-links a:hover::before{transform:translateX(120%)}
.nav-links a.hot{background:linear-gradient(180deg,var(--c-paper) 0%,var(--c-silver-hi) 48%,var(--c-silver-lo) 100%);color:var(--c-on-light);border-color:var(--c-paper);font-weight:500;
  box-shadow:inset 0 1px 0 var(--c-inset-hi)}

/* header */
.head{padding:2.4rem 0 1.4rem;text-align:center}
.head h1{font-size:clamp(1.7rem,4.5vw,2.6rem);font-weight:500;letter-spacing:-.03em;color:var(--c-paper)}
.head .sub{color:var(--muted);font-size:.9rem;margin-top:.4rem}
.count-pill{display:inline-block;margin-top:.9rem;padding:.4rem 1.1rem;border:1px solid var(--border);border-radius:999px;
  background:var(--panel);color:var(--text);font-size:.78rem;font-weight:500;letter-spacing:.02em}

/* toolbar */
.toolbar{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;justify-content:center;margin:1.4rem 0 1.8rem}
.toolbar input{background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);
  padding:.62rem 1.15rem;font-size:.9rem;min-width:240px;outline:none;transition:border-color .25s,box-shadow .25s}
.toolbar input::placeholder{color:var(--muted)}
.toolbar input:focus{outline:2px solid var(--c-focus);outline-offset:2px}
.toolbar select{background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);
  padding:.62rem 1rem;font-size:.85rem;outline:none;cursor:pointer;transition:border-color .25s}
.toolbar select:focus{outline:2px solid var(--c-focus);outline-offset:2px}

/* grid of cards — monochrome panels */
.grid{columns:268px;column-gap:1.1rem;padding-bottom:3rem}
.grid .card{break-inside:avoid;margin-bottom:1.1rem;display:inline-flex;width:100%}
.card{border:1px solid var(--border);border-radius:12px;background:linear-gradient(165deg,var(--c-wash-3),var(--c-wash-1) 60%,var(--c-shade-1));
  overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s,box-shadow .2s;position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--c-rule-5);box-shadow:0 16px 40px var(--c-shade-4)}
.card .ph{position:relative;aspect-ratio:16/10;background:var(--c-well-2);overflow:hidden;cursor:pointer}
.card .noimg{width:100%;height:100%;display:grid;place-items:center;font-weight:600;font-size:1.15rem;letter-spacing:-.02em;color:var(--c-ink-1);
  background:radial-gradient(circle at 50% 42%,var(--c-wash-5),transparent 70%),linear-gradient(165deg,--c-well-3,var(--c-steel-a))}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .lvl{text-transform:none;letter-spacing:0;position:absolute;top:.6rem;left:.6rem;background:var(--c-shade-6);border:1px solid var(--border);color:var(--c-ink-1);
  font-size:.68rem;font-weight:500;letter-spacing:.01em;padding:.22rem .58rem;border-radius:999px;text-transform:uppercase;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card .stock{position:absolute;top:.6rem;right:.6rem;background:var(--c-shade-6);border:1px solid var(--border-soft);color:var(--muted);
  font-size:.62rem;font-weight:500;padding:.22rem .52rem;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card .bd{padding:1rem 1.05rem 1.1rem;display:flex;flex-direction:column;flex:1}
.card .row1{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem}
.card .p{font-size:1.4rem;font-weight:600;color:var(--c-paper);letter-spacing:-.02em}
.card .id{font-size:.72rem;font-weight:500;letter-spacing:.02em;color:var(--muted);text-transform:none}
.card .t{font-size:.86rem;font-weight:500;line-height:1.4;margin:.45rem 0 .55rem;color:var(--c-ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .more{font-size:.78rem;color:var(--muted);cursor:pointer;font-weight:500;letter-spacing:.02em;align-self:flex-start;
  background:none;border:none;padding:0;margin:.35rem 0 .8rem;transition:color .2s}
.card .more:hover{color:var(--c-paper)}
.card .desc{font-size:.8rem;color:var(--muted);line-height:1.55;white-space:pre-line;display:none;margin:.3rem 0 .4rem}
.card.open .desc{display:block}
.card .go{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  background:linear-gradient(180deg,var(--c-paper) 0%,var(--c-silver-hi) 48%,var(--c-silver-lo) 100%);color:var(--c-on-light);font-weight:500;font-size:.8rem;letter-spacing:0;
  padding:.68rem 1rem;border-radius:7px;border:1px solid var(--c-paper);box-shadow:inset 0 1px 0 var(--c-inset-hi);
  transition:box-shadow .3s,background .3s;text-align:center;position:relative;overflow:hidden}
.card .go::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,var(--c-rule-6) 48%,transparent 76%);
  transform:translateX(-130%);transition:transform .65s ease;pointer-events:none}
.card .go:hover{background:linear-gradient(180deg,var(--c-paper) 0%,--c-light-hi 42%,--c-light-lo 100%);box-shadow:inset 0 1px 0 var(--c-paper),0 0 22px var(--c-cool-glow-lg)}
.card .go:hover::after{transform:translateX(130%)}

/* modal */
.modal{position:fixed;inset:0;background:var(--c-scrim-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:1rem}
.modal.open{display:flex}
.modal .box{background:var(--c-well-2);border:1px solid var(--border);border-radius:14px;max-width:680px;width:100%;max-height:88vh;
  overflow-y:auto;position:relative;box-shadow:0 30px 90px var(--c-scrim)}
.modal .box .x{position:absolute;top:.7rem;right:.9rem;background:var(--c-scrim);border:1px solid var(--border);color:var(--text);
  width:2.1rem;height:2.1rem;border-radius:999px;font-size:1rem;cursor:pointer;z-index:2;transition:border-color .2s}
.modal .box .x:hover{border-color:var(--c-hairline-hi)}
.modal .box img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--c-steel-a)}
.modal .box .inner{padding:1.2rem 1.3rem 1.4rem}
.modal .box .row1{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem}
.modal .box .p{font-size:1.8rem;font-weight:600;color:var(--c-paper);letter-spacing:-.02em}
.modal .box .t{font-size:.95rem;font-weight:500;margin:.5rem 0 .8rem;line-height:1.45;color:var(--c-ink-1)}
.modal .box .desc{font-size:.86rem;color:var(--muted);line-height:1.6;white-space:pre-line;border-top:1px solid var(--border-soft);padding-top:.8rem}
.modal .box .go{display:flex;justify-content:center;margin-top:1.2rem;
  background:linear-gradient(180deg,var(--c-paper) 0%,var(--c-silver-hi) 48%,var(--c-silver-lo) 100%);color:var(--c-on-light);font-weight:500;letter-spacing:0;
  padding:.95rem;border-radius:8px;border:1px solid var(--c-paper);box-shadow:inset 0 1px 0 var(--c-inset-hi);font-size:.9rem}

.empty{text-align:center;color:var(--muted);padding:3rem 0;display:none}
footer{border-top:1px solid var(--border-soft);padding:1.5rem;text-align:center;color:var(--muted);font-size:.7rem;letter-spacing:.01em;text-transform:none}


/* ── hallmark pass ── */
:where(a,button,summary,input,select):focus-visible{outline:2px solid var(--c-focus);outline-offset:3px;border-radius:6px}
.toolbar input:focus,.toolbar select:focus{outline:2px solid var(--c-focus);outline-offset:2px}
.card .go:active,.modal .box .go:active{transform:translateY(1px)}
.card[aria-disabled="true"]{opacity:.45;pointer-events:none}
.head h1{text-wrap:balance}
.count-pill,.card .p{font-variant-numeric:tabular-nums}
footer{text-transform:none;letter-spacing:.04em}

@media(max-width:640px){
  .grid{columns:2;column-gap:.7rem}
  .grid .card{margin-bottom:.7rem}
  .card .bd{padding:.7rem .75rem}
  .card .p{font-size:1.12rem}
  .card .t{font-size:.74rem}
  .card .go{font-size:.7rem;padding:.58rem .5rem}
  .nav-links a:not(.hot){display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body style="background:var(--c-base);color:var(--c-paper)">

<nav class="nav"><div class="wrap nav-in">
  <a class="nav-logo" href="/">Acc<span>Zone</span></a>
  <div class="nav-links">
    <a href="/#accounts">Featured</a><a href="/#reviews">Reviews</a><a href="/#faq">FAQ</a>
    <a class="hot" href="https://zeusx.com/seller/acczone-25504" target="_blank" rel="noopener">Store ↗</a>
  </div>
</div></nav>

<div class="wrap">
  <header class="head">
    <h1>All Accounts</h1>
    <div class="sub">Every live listing: photos, full details, instant delivery on ZeusX</div>
    <div class="count-pill" id="count">loading…</div>
  </header>

  <div class="toolbar">
    <input id="q" type="search" placeholder="Search: level, mythic, K/D…" autocomplete="off">
    <select id="sort">
      <option value="price_asc">Price ↑</option>
      <option value="price_desc">Price ↓</option>
      <option value="level_desc">Level ↓</option>
      <option value="level_asc">Level ↑</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No accounts match. Try another search.</div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <button class="x" onclick="closeModal()">✕</button>
    <img id="m-img" alt="" width="680" height="382" src="og-image.png" hidden>
    <div class="inner">
      <div class="row1"><div class="p" id="m-price"></div><div class="id" id="m-lvl"></div></div>
      <div class="t" id="m-title"></div>
      <div class="desc" id="m-desc"></div>
      <a class="go" id="m-go" target="_blank" rel="noopener">Proceed to store ↗</a>
    </div>
  </div>
</div>

<footer>© 2026 acczone · all orders via zeusx escrow · aewop.online</footer>

<script>
let DATA=[];
const grid=document.getElementById('grid');
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeHttp=s=>{try{const u=new URL(String(s||''),location.href);return (u.protocol==='https:'||u.protocol==='http:')?u.href:'';}catch(e){return '';}};

function render(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const sort=document.getElementById('sort').value;
  let items=DATA.filter(o=>{
    if(!q) return true;
    const hay=(o.title+' '+(o.level||'')+' '+(o.desc||'')).toLowerCase();
    return q.split(/\s+/).every(w=>hay.includes(w));
  });
  const lvl=o=>parseInt((o.level||'').replace(/\D/g,''))||0;
  if(sort==='price_asc') items.sort((a,b)=>a.price-b.price);
  if(sort==='price_desc') items.sort((a,b)=>b.price-a.price);
  if(sort==='level_desc') items.sort((a,b)=>lvl(b)-lvl(a));
  if(sort==='level_asc') items.sort((a,b)=>lvl(a)-lvl(b));

  document.getElementById('count').textContent=items.length+' accounts live';
  document.getElementById('empty').style.display=items.length?'none':'block';
  grid.innerHTML=items.map(o=>`
    <article class="card" data-id="${o.id}">
      <div class="ph" onclick="openModal('${o.id}')">
        ${o.thumb||o.img
          ?`<img loading="lazy" src="${esc(o.thumb||o.img)}" alt="${esc(o.title).slice(0,80)}" onerror="this.remove()">`
          :`<div class="noimg">${esc(o.level)||'CoDM'}</div>`}
        <span class="lvl">${esc(o.level)||'CoDM'}</span>
        ${o.stock>1?`<span class="stock">×${o.stock}</span>`:''}
      </div>
      <div class="bd">
        <div class="row1"><span class="p">$${o.price.toFixed(2)}</span><span class="id">#${o.id.slice(0,6)}</span></div>
        <div class="t">${esc(o.title)}</div>
        <button class="more" onclick="toggleDesc(this)">More details ▾</button>
        <div class="desc">${esc(o.desc)}</div>
        <a class="go" href="${esc(safeHttp(o.url))}" target="_blank" rel="noopener">Proceed to store</a>
      </div>
    </article>`).join('');
}

function toggleDesc(btn){
  const card=btn.closest('.card'); card.classList.toggle('open');
  btn.textContent=card.classList.contains('open')?'More details ▴':'More details ▾';
}
function openModal(id){
  const o=DATA.find(x=>x.id===id); if(!o) return;
  document.getElementById('m-img').src=safeHttp(o.img||o.thumb);
  document.getElementById('m-img').style.display=o.img||o.thumb?'block':'none';
  document.getElementById('m-price').textContent='$'+o.price.toFixed(2);
  document.getElementById('m-lvl').textContent=o.level||'CoDM';
  document.getElementById('m-title').textContent=o.title;
  document.getElementById('m-desc').textContent=o.desc||'Contact us on ZeusX for full details.';
  document.getElementById('m-go').href=safeHttp(o.url);
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('q').addEventListener('input',render);
document.getElementById('sort').addEventListener('change',render);

fetch('catalog.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d; render();
}).catch(()=>{document.getElementById('count').textContent='failed to load catalog';});
</script>
</body>
</html>
